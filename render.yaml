# Render Blueprint - lets you spin up the API + database from one file.
# Dashboard > New > Blueprint > point at this repo.
services:
  - type: web
    name: usea-backend
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: usea-db
          property: connectionString
      - key: DB_SSL
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGINS
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        sync: false
      - key: VOTE_PRICE_USD
        value: 0.90

databases:
  - name: usea-db
    plan: starter
