# Render Blueprint - web service only. Database is external (Supabase,
# accessed via a pooled Postgres connection string).
services:
  - type: web
    name: usea-backend
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # paste your Supabase pooled connection string here
      - key: DB_SSL
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGINS
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        sync: false
      - key: VOTE_PRICE_USD
        value: 0.90
      - key: VOTE_PRICE_KES
        value: 120
